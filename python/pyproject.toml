[tool.poetry]
name = "genzite-python-agents"
version = "0.1.0"
description = "Python agents for the Genzite no-code website builder"
authors = ["Genzite AI Team"]

[tool.poetry.dependencies]
python = "^3.11"
grpcio = "^1.64.1"
grpcio-tools = "^1.64.1"
redis = {version = "^5.0.4", extras = ["hiredis"]}
pydantic = "^2.7.4"
python-dotenv = "^1.0.1"
asyncio = "^3.4.3"
langchain = "^0.2.1"
openai = "^1.30.1"
pydantic-settings = "^2.3.0"

[tool.poetry.dev-dependencies]
pytest = "^8.2.2"
pytest-asyncio = "^0.23.7"
black = "^24.4.2"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
